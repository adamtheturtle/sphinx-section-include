---
name: Release

on: workflow_dispatch

permissions: {}

jobs:
  build:
    name: Publish a release
    runs-on: ubuntu-latest

    # Specifying an environment is strongly recommended by PyPI.
    # See https://github.com/pypa/gh-action-pypi-publish/tree/release/v1/?tab=readme-ov-file#trusted-publishing.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    environment: release

    permissions:
      # This is needed for PyPI publishing.
      # See https://github.com/pypa/gh-action-pypi-publish/tree/release/v1/?tab=readme-ov-file#trusted-publishing.
      id-token: write
      # This is needed to create the release tag and upload distributions.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all history and tags for version calculation.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Calver calculate version
        uses: StephaneBour/actions-calver@master
        id: calver
        with:
          date_format: '%Y.%m.%d'
          release: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the reviewed release notes
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
        run: |
          test -f "changelog/$RELEASE.md"
          cp "changelog/$RELEASE.md" release-notes.md

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.calver.outputs.release }}
          tag_prefix: ''
          commit_sha: ${{ github.sha }}

      - name: Build a binary wheel and a source tarball
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git fetch --tags
          git checkout "$NEW_TAG"
          uv build --sdist --wheel --out-dir dist/
          uv run --group=release check-wheel-contents dist/*.whl

      - name: Test the installed wheel
        run: uv run --group=dev python tests/wheel_smoke.py

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          makeLatest: true
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: release-notes.md
          artifacts: dist/*
          artifactErrorsFailBuild: true

      # We use PyPI trusted publishing rather than a PyPI API token.
      # See https://github.com/pypa/gh-action-pypi-publish/tree/release/v1/?tab=readme-ov-file#trusted-publishing.
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
